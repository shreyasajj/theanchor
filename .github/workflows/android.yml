name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    permissions:
      # Needed by the release step below to create a release and upload the APK.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        # Kept on failure so a red build says which test broke without a rerun.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Set up the release key
        # Android installs an update only when it carries the same signature
        # as the installed app, so release is signed with one fixed key kept
        # in repository secrets. Without them (Dependabot, a fork) the build
        # falls back to a throwaway debug key and says so.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANCHOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-release.jks"
            echo "ANCHOR_KEYSTORE_FILE=$RUNNER_TEMP/anchor-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secret: this APK is signed with a throwaway key and will not install over an existing app."
          fi

      - name: Build APKs
        env:
          ANCHOR_KEYSTORE_PASSWORD: ${{ secrets.ANCHOR_KEYSTORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANCHOR_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANCHOR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Name the APKs
        id: apks
        run: |
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          short=${GITHUB_SHA::7}
          name="anchor-${version}-build${GITHUB_RUN_NUMBER}-${short}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/${name}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${name}-debug.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.name }}
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish a release with the APK
        # Only for pushes to main: a pull request build stops at the artifact.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          NAME: ${{ steps.apks.outputs.name }}
          VERSION: ${{ steps.apks.outputs.version }}
        run: |
          notes=$(git log -1 --pretty=format:'%s%n%n%b')
          gh release create "$TAG" \
            --title "The Anchor $VERSION (build ${GITHUB_RUN_NUMBER})" \
            --notes "$notes" \
            --latest \
            "artifacts/${NAME}.apk#The Anchor (release, sideload this one)" \
            "artifacts/${NAME}-debug.apk#The Anchor (debug, fresh install only)"

  dependency-graph:
    name: Submit dependency graph
    # Resolves the full Gradle graph, transitive dependencies included, so
    # Dependabot alerts cover more than what the build files declare.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
